version: '3.8'

services:
  postgres:
    container_name: postgres
    image: postgres:17.0
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DATABASE}
    ports:
      - '${PG_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - app_auth_network

volumes:
  postgres_data:
    driver: local

networks:
  app_auth_network:
    driver: bridge
